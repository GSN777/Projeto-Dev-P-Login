<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>GSLogin</title>
</head>

<body>
    <div class="stars"></div>
    <div class="form">
        <h1>Login</h1>
        <form action="#">
            <div class="box-form">
                <input type="text" placeholder="Nome de usuário">
                <i class="bx bx-user"></i>
            </div>
            <div class="box-form">
                <input type="password" placeholder="Senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-for-got">
                <label><input type="checkbox">Lembrar</label>
                <a href="#">Esqueci minha senha</a>
            </div>
            
            <button type="submit">Entrar</button>
            
            <div class="register-link">
            <p>Não tem conta? <a>Registrar</a></p>
            </div>

        </form>
    </div>

    <footer class="footer">
        <address>
            <p>
                Site desinvolvido por :<a href="https://www.instagram.com/gabrielsn___/?hl=pt-br">Gabriel dos santos neves</a>
            </p>
            <p>&copy; 2026 Minha página. Todos os direitos reservados.</p>
        </address>
    </footer>
</body>

</html>
